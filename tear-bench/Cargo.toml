[package]
name = "tear-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The all-variants gate for tear: the case matrix, the floors measured in the same run, the isolated harness and the derived verdicts."
publish = false

[lints]
workspace = true

[lib]
name = "tear_bench"

[[bin]]
name = "tearbench"
path = "src/bin/tearbench.rs"

[features]
default = []
bench-probes = [
    "tear-types/bench-probes",
    "tear-core/bench-probes",
    "tear-client/bench-probes",
    "makimono/bench-probes",
]

[dependencies]
tear-types = { workspace = true }
tear-core = { workspace = true }
tear-client = { workspace = true, features = ["engate"] }
engate-attach = "0.1.5"
engate-types = "0.1"
tear-config = { workspace = true }
makimono = { workspace = true }
kotae = "0.1"
clap = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
nix = { workspace = true, features = ["fs", "process", "signal", "term", "socket", "time"] }
libc = "0.2"

[dev-dependencies]
trybuild = "1"
tamotsu = { workspace = true }
blake3 = { workspace = true }
