[package]
name = "tear-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shikumi-style live configuration for the tear multiplexer. Parses ~/.config/tear/tear.yaml, watches it for changes, publishes the parsed TearConfig via Arc<TearConfig> swap. Same configuration story mado uses — operators learn one config style for both apps."

[lints]
workspace = true

[dependencies]
# okiba (置き場) — XDG resolution where a RELATIVE or empty override is IGNORED
# per spec rather than joined. default_config_path took $XDG_CONFIG_HOME
# verbatim and fell back to the literal `.`, so an empty one made tear read
# `tear/tear.yaml` out of whatever directory it was launched from — a
# different config per cwd, silently, because a missing config file falls back
# to defaults instead of erroring.
okiba = "0.2"
tear-types = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
# M1 (four-tool ecosystem migration): tear-config now wraps
# shikumi::ConfigStore under the LiveConfig public API.
# Eliminates the hand-rolled ArcSwap+notify duplication; tear
# becomes shikumi consumer #3 (after mado + frost). Resolves
# via the workspace shikumi pin (git@pleme-io/shikumi) so we
# always run against the same rev the rest of the fleet uses.
shikumi.workspace = true
# Fleet keybind atlas — tear's multiplexer prefix is sourced from
# `ishou_tokens::FleetKeybinds::prescribed().multiplexer_prefix`
# (canonical chord "C-b", normalized through KeyChord::from_tmux
# to "ctrl+b"). Atlas drift → tear default prefix changes fleet-wide
# on next compile. Closes the 2026-05-21 chord-drift class of bug
# for the multiplexer surface.
ishou-tokens = { workspace = true }
