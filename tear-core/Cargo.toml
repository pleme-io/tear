[package]
name = "tear-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime logic for the tear multiplexer — InProcess MultiplexerControl impl backed by portable-pty. The single source of truth for pane semantics across pleme-io GUI consumers (mado at tier 3)."

[lints]
workspace = true

[features]
default = []
# Opt-in engate Producer impl. Off by default so consumers that only
# use tear-core's MultiplexerControl path don't pull in engate's
# typestate machinery + drop_bomb + typed-builder.
engate = ["dep:engate-types", "dep:engate-attach", "tear-types/engate"]

[dependencies]
tear-types = { workspace = true }
tear-config = { workspace = true }
# Typed cross-tool environment contract — FleetStateVar owns the
# canonical TEAR_* env-var names tear stamps onto every spawned pane
# (seki's prompt reads the same typed variants). The name lives in
# exactly one place: a rename is a compile-time change on both sides.
ishou-tokens = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
once_cell = { workspace = true }
blake3 = { workspace = true }
vte = { workspace = true }
unicode-width = { workspace = true }
engate-types = { version = "0.1", optional = true }
engate-attach = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"
# Terminal-conformance contract — the VT query catalog the
# espelho_conformance integration test feeds through PaneGrid + the
# InProcess subscriber fan-out (relay/pass-through row).
espelho = { workspace = true }
