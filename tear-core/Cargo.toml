[package]
name = "tear-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime logic for the tear multiplexer — InProcess MultiplexerControl impl backed by portable-pty. The single source of truth for pane semantics across pleme-io GUI consumers (mado at tier 3)."

[lints]
workspace = true

[features]
default = []
# Opt-in engate Producer impl. Off by default so consumers that only
# use tear-core's MultiplexerControl path don't pull in engate's
# typestate machinery + drop_bomb + typed-builder.
engate = ["dep:engate-types", "dep:engate-attach"]

[dependencies]
tear-types = { workspace = true }
tear-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
once_cell = { workspace = true }
blake3 = { workspace = true }
vte = { workspace = true }
engate-types = { git = "https://github.com/pleme-io/engate", branch = "main", optional = true }
engate-attach = { git = "https://github.com/pleme-io/engate", branch = "main", optional = true }

[dev-dependencies]
proptest = "1"
