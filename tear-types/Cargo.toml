[package]
name = "tear-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure types for the tear multiplexer — TearSession/Window/Pane/Layout/KeyTable/Hook/StatusBar, the MultiplexerControl trait, no I/O. Consumed by tear-core, tear-client, mado, and any third-party driver."

[lints]
workspace = true

[features]
default = []
# Opt-in PaneSnapshotWrap that impls engate::Snapshot. Lets every
# engate Producer over a tear pane (tear-core embedded, tear-client
# daemon, future tear-web) share ONE Snap type so consumers like
# mado need only one Consumer impl across all backends.
engate = ["dep:engate-types"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
# TearTheme derives every color from the fleet prescribed palette
# (`ishou_tokens::FleetDefaults::prescribed()` → resolved theme), the
# SAME source mado reads — so tear and mado converge by construction.
ishou-tokens = { workspace = true }
engate-types = { version = "0.1", optional = true }
