[package]
name = "tear-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure types for the tear multiplexer — TearSession/Window/Pane/Layout/KeyTable/Hook/StatusBar, the MultiplexerControl trait, no I/O. Consumed by tear-core, tear-client, mado, and any third-party driver."

[lints]
workspace = true

[features]
default = []
# Opt-in PaneSnapshotWrap that impls engate::Snapshot. Lets every
# engate Producer over a tear pane (tear-core embedded, tear-client
# daemon, future tear-web) share ONE Snap type so consumers like
# mado need only one Consumer impl across all backends.
engate = ["dep:engate-types"]

[dependencies]
# kukaku (区画) — the split-tree layout algebra this crate used to define
# inline. Extracted when omoya became its third consumer; `layout`,
# `geometry` and `direction` here are now re-exports, so tear's own source
# and its CBOR wire are unchanged.
kukaku = { workspace = true }
# okiba (置き場) — XDG resolution where a RELATIVE or empty override is IGNORED
# per spec rather than joined. default_socket_path took $XDG_RUNTIME_DIR
# verbatim, so an empty one made the tear socket cwd-relative — across 10 call
# sites and 6 binaries, and this crate is in 14 manifests.
okiba = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
# TearTheme derives every color from the fleet prescribed palette
# (`ishou_tokens::FleetDefaults::prescribed()` → resolved theme), the
# SAME source mado reads — so tear and mado converge by construction.
ishou-tokens = { workspace = true }
engate-types = { version = "0.1", optional = true }
