# mado-web is its own workspace root — wasm32-unknown-unknown
# target shouldn't slow down the host-side workspace's test
# cycle. Build explicitly via `wasm-pack build --target web` from
# this directory.
[workspace]

[package]
name = "mado-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pleme-io/tear"
authors = ["pleme-io"]
description = "mado-web — browser-side renderer that attaches to tear-daemon via tear-ws-bridge. wasm32-unknown-unknown crate; consumes the same typed CBOR wire as native mado."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tear-types = { git = "https://github.com/pleme-io/tear" }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm32-unknown-unknown bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Window",
  "WebSocket",
  "MessageEvent",
  "BinaryType",
  "ErrorEvent",
  "CloseEvent",
  "Event",
  "EventTarget",
]
