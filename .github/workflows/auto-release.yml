name: auto-release

# Actions RUN for this repository. The declaration is `actions_enabled:
# true` on the `tear` record in pangea-architectures
# `workspaces/pleme-io-opensource/org.yaml` (flipped 2026-08-03), and
# `GET /repos/pleme-io/tear/actions/permissions` answers {"enabled": true}
# (measured 2026-10-07). Every push to main runs this workflow — the test
# gate, then bump + tag and publish — and every workspace crate, `pleme-tear`
# included, is on crates.io; `mado-web` sits outside the workspace and is not.
# Actions on/off is still owned by that org.yaml field, never the GitHub UI or
# API: open_source_repo.rb reconciles the repository permission from it.
#
# The test gate runs with `--all-features` (`test-args` below), the same set
# ci.yml runs on every push and pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch
  #
  # RETIRED 2026-07-30 — the `*/15 * * * *` drip tick that used to sit here.
  #
  # Its comment claimed the tick was "idempotent + a no-op in seconds once
  # converged, so it's safe to leave armed". That was measurably false. The
  # last 100 schedule-triggered runs — 2026-07-12T11:37:31Z through
  # 2026-07-19T00:09:36Z, the newest run of any kind in this repo — were
  # 100/100 FAILURES. Every one died the same way:
  #
  #   JOB:  release / Drip-publish remaining capacity => failure
  #   step: pleme-io/actions/rust-workspace-publish@main => failure
  #
  # So the tick was not draining a stranded publish; it was a self-renewing
  # red-run generator firing 96×/day on a metered hosted runner, and the
  # comment asserting otherwise is what made it invisible. Actions run
  # again (header), so re-adding this cron would resume the failure storm
  # rather than finish anything.
  #
  # The drip job itself is NOT retired — substrate's rust-auto-release.yml
  # still ships it, and `push` + `workflow_dispatch` below still reach it.
  # What is retired is the unattended timer, whose only demonstrated effect
  # was noise. If a genuinely stranded publish needs draining, run
  # `workflow_dispatch` deliberately and read the result.
  #

# NO concurrency override here — the substrate reusable
# (rust-auto-release.yml) OWNS serialization: `cancel-in-progress: false`
# grouped per-repository, so an in-flight release (bump → commit → tag →
# push → SHIP, which rides the crates.io rate limit for up to 30m) ALWAYS
# finishes; a second push queues behind it.
#
# The previous `cancel-in-progress: true` override here was the bug: the
# bump job's own release-commit push triggered a SUPERSEDING run that
# cancelled the run doing the actual crates.io publish (the `ship` job).
# Result — the workspace bumped + tagged on every push (versions advanced)
# but NEVER shipped to crates.io (tear-types/praca/… were never published).
# Conform to the canonical 3-line shim; let the substrate govern.

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
      test-args: "--workspace --all-features --no-fail-fast"
    secrets: inherit
