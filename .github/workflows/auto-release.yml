name: auto-release

# ┌─ DORMANT: Actions are DISABLED for this repository ────────────────────┐
#
# Nothing in this file runs today, and no trigger below can change that.
# `GET /repos/pleme-io/tear/actions/permissions` returns
# {"enabled": false} (measured 2026-07-30), and that is DECLARED, not drift:
# pangea-architectures `workspaces/pleme-io-opensource/org.yaml` carries
# `actions_enabled: false` on the `tear` record. 14 of 860 records set it
# explicitly — a deliberate CI-cost/noise posture, not an oversight.
#
# CONSEQUENCE, stated plainly so the next reader doesn't hunt for a bug:
# `pleme-tear` and `mado-web` are ABSENT from crates.io (both 404) and no
# automated path can put them there while Actions are off. That is an
# accepted state, not a stranded release. `tear-types` and `praca` are on
# the registry from before the posture changed.
#
# THE REVERSAL IS ONE LINE: flip `actions_enabled` to `true` on the `tear`
# record in that org.yaml and let the reconciler apply it. Do NOT enable
# Actions through the GitHub UI or API — open_source_repo.rb emits
# `github_actions_repository_permissions enabled=false` from the declared
# value, so an unmanaged re-enable is REVERTED on the next reconcile.
#
# The wiring below is kept, not deleted (MODULARIZE, DON'T DELETE): it is
# correct, and it resumes on its own the moment the declaration flips.
#
# └────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch
  #
  # RETIRED 2026-07-30 — the `*/15 * * * *` drip tick that used to sit here.
  #
  # Its comment claimed the tick was "idempotent + a no-op in seconds once
  # converged, so it's safe to leave armed". That was measurably false. The
  # last 100 schedule-triggered runs — 2026-07-12T11:37:31Z through
  # 2026-07-19T00:09:36Z, the newest run of any kind in this repo — were
  # 100/100 FAILURES. Every one died the same way:
  #
  #   JOB:  release / Drip-publish remaining capacity => failure
  #   step: pleme-io/actions/rust-workspace-publish@main => failure
  #
  # So the tick was not draining a stranded publish; it was a self-renewing
  # red-run generator firing 96×/day on a metered hosted runner, and the
  # comment asserting otherwise is what made it invisible. It now cannot
  # fire at all (Actions disabled, above), which means re-enabling Actions
  # with this cron still present would resume the failure storm rather than
  # finish anything.
  #
  # The drip job itself is NOT retired — substrate's rust-auto-release.yml
  # still ships it, and `push` + `workflow_dispatch` below still reach it.
  # What is retired is the unattended timer, whose only demonstrated effect
  # was noise. If a genuinely stranded publish needs draining after Actions
  # come back, run `workflow_dispatch` deliberately and read the result.
  #

# NO concurrency override here — the substrate reusable
# (rust-auto-release.yml) OWNS serialization: `cancel-in-progress: false`
# grouped per-repository, so an in-flight release (bump → commit → tag →
# push → SHIP, which rides the crates.io rate limit for up to 30m) ALWAYS
# finishes; a second push queues behind it.
#
# The previous `cancel-in-progress: true` override here was the bug: the
# bump job's own release-commit push triggered a SUPERSEDING run that
# cancelled the run doing the actual crates.io publish (the `ship` job).
# Result — the workspace bumped + tagged on every push (versions advanced)
# but NEVER shipped to crates.io (tear-types/praca/… were never published).
# Conform to the canonical 3-line shim; let the substrate govern.

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
