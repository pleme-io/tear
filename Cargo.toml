[workspace]
resolver = "2"
members = [
    "tear-types",
    "tear-config",
    "tear-core",
    "tear-daemon",
    "tear-client",
    "tear-tmux-backend",
    "tear-ws-bridge",
    "tear",
    "praca",
]

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pleme-io/tear"
repository = "https://github.com/pleme-io/tear"
authors = ["pleme-io"]

[workspace.dependencies]
# ── tear internal crates ────────────────────────────────────────────
tear-types = { path = "tear-types", version = "0.1.15" }
tear-config = { path = "tear-config", version = "0.1.15" }
tear-core = { path = "tear-core", version = "0.1.15" }
tear-daemon = { path = "tear-daemon", version = "0.1.15" }
tear-client = { path = "tear-client", version = "0.1.15" }
tear-tmux-backend = { path = "tear-tmux-backend", version = "0.1.15" }
tear-ws-bridge = { path = "tear-ws-bridge", version = "0.1.15" }
tear = { path = "tear", version = "0.1.15" }
praca = { path = "praca", version = "0.1.15" }

# ── pleme-io shared libraries — same versions mado pins ────────────
# Live configuration with hot-reload. Operators learn the shikumi
# config style ONCE — mado + tear both consume `~/.config/<app>/<app>.yaml`
# via shikumi so cross-tool muscle memory carries over.
# `cli` feature pulls in shikumi::cli::ConfigShowCommand — the reusable
# clap subcommand factory tear's binary wires into via one Subcommand
# variant.
#
# ★ crates.io ONLY — no git source. The previous `branch = "main"` pin was
# annotated "so the workspace stays on a single canonical shikumi source",
# which held INSIDE this workspace and was false across the fleet: a git
# source (by branch, by rev, or by tag) is a distinct source that cargo
# cannot unify with any other spelling. Measured 2026-08-06 — shikumi was
# reached three incompatible ways at once (mado `rev`, shidou
# `version+git+rev`, tear `branch=main`), so no two of them could exchange
# a shikumi type. A semver range unifies automatically from one registry;
# mado's own Cargo.toml already documents that failure for garasu.
shikumi = { version = "0.1", features = ["cli"] }
# Typed design tokens — palette + typography. tear's StatusBar /
# tab-bar / pane-border / message colors all resolve through ishou
# so a fleet-wide colorway change is one ishou-tokens edit.
ishou-tokens = "0.1"
# Typed terminal-conformance contract (dev-only). tear-core's
# conformance tests drive PaneGrid + the subscriber fan-out against
# espelho's VT query catalog — tear is the pass-through RELAY row
# (queries survive verbatim to subscribers); mado holds the host row,
# frost the guest row.
espelho = "0.1"
# The fleet's ONE frecency-ranking primitive — the decay curve praça ranks
# sessions by. praça used to hand-copy `DecayKind::ZoxideLogBuckets`' bucket
# thresholds and multipliers out of this crate while depending on nothing;
# it now selects the curve from the primitive, so a fleet-wide change to how
# recency decays reaches tear the same way it reaches wadachi and skim-tab.
#
# ★ crates.io, for the same reason shikumi is (above): a git source is a
# distinct source cargo cannot unify, and skim-tab already reaches this crate
# from the registry. Two spellings would mean two wadachi-specs in one fleet
# closure — the exact drift this dependency exists to remove.
#
# ★ EXACT pin, and it is an MSRV pin, not a taste pin. wadachi-spec raised its
# `rust-version` to 1.95.0 at 0.1.8 and 1.97.0 at 0.1.9; this workspace declares
# 1.89.0. 0.1.7 is the newest release that fits, and its `DecayKind` body is
# byte-identical to HEAD's, so nothing praça reads is older than current. A
# caret range would resolve to 0.1.9 and fail the build outright under
# `resolver = "2"` (no MSRV-aware resolution), so the pin fails LOUDLY at the
# manifest instead of quietly at the next `cargo update`.
#
# Destination: move this workspace's MSRV onto the fleet's, then relax to a
# caret. That also unblocks selecting the ranking by name —
# `FrecencyRankingSpec::by_name("praca-parity")` + `score_counted()` land in
# wadachi-spec after 0.1.9 (see praca/src/frecency.rs, "Named interim").
wadachi-spec = "=0.1.7"

# ── canonical fleet runtime crates ─────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
arc-swap = "1"
mimalloc = { version = "0.1", default-features = false }
blake3 = "1"
once_cell = "1"
# MUST be macos_fsevent, never macos_kqueue — the latter is a poison feature
# that switches every macOS consumer of notify to a backend holding one open FD
# per watched path (measured: 26,517 FDs in one daemon). Rationale in full at
# shikumi/Cargo.toml's notify declaration.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# ── PTY backend (cross-platform; same crate mado uses transitively) ─
portable-pty = "0.9"

# ── VT100/xterm parser (same major mado uses; one parser fleet-wide) ─
vte = "0.15"

# ── Character display width ─────────────────────────────────────────
# MUST track mado's pin (mado/Cargo.toml declares "0.2", resolves 0.2.2).
# Width tables change between releases, so a version skew here is the
# way to be parity-SHAPED but wrong: it presents as a handful of exotic
# codepoints disagreeing, which reads like a bad test corpus rather than
# a dependency problem. If mado's pin moves, move this one in the same
# commit.
unicode-width = "0.2"

# ── RPC wire format (tear-daemon ↔ tear-client) ─────────────────────
# ciborium (CBOR / RFC 8949) — self-describing binary serde format
# that handles internally-tagged enums (LayoutNode uses
# `#[serde(tag = "kind")]` so bincode is off the table). Fast enough
# for IPC (the wire is single Request/Response per call, not a
# streaming hot path) and the on-wire bytes stay debug-inspectable
# via `cbor-diag` / `pycbor`.
ciborium = "0.2"

# ── unit conversions for layout / dimensions ────────────────────────
# `socket` is for the peer-credential read that gives shutai its attested
# arm (LOCAL_PEERCRED on Apple, SO_PEERCRED on Linux). It matters that nix
# provides a SAFE wrapper: every tear crate is `#![forbid(unsafe_code)]`,
# so a raw libc call would not compile.
nix = { version = "0.30", features = ["term", "socket"] }

# ── WebSocket transport for the browser-facing tear-ws-bridge (#1) ─
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile]

[profile.release]
codegen-units = 1
# opt-level = 3 (speed). Same shape mado uses — tear is a daemon and
# CLI that compose with mado for fleet pane semantics; size opt would
# regress the hot-path operations (PTY pump, status-bar refresh).
opt-level = 3
lto = "fat"
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

