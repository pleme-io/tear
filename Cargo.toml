[workspace]
resolver = "2"
members = [
    "tear-types",
    "tear-config",
    "tear-core",
    "tear-daemon",
    "tear-client",
    "tear-tmux-backend",
    "tear-ws-bridge",
    "tear",
    "praca",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pleme-io/tear"
repository = "https://github.com/pleme-io/tear"
authors = ["pleme-io"]

[workspace.dependencies]
# ── tear internal crates ────────────────────────────────────────────
tear-types = { path = "tear-types", version = "0.1.0" }
tear-config = { path = "tear-config", version = "0.1.0" }
tear-core = { path = "tear-core", version = "0.1.0" }
tear-daemon = { path = "tear-daemon", version = "0.1.0" }
tear-client = { path = "tear-client", version = "0.1.0" }
tear-tmux-backend = { path = "tear-tmux-backend", version = "0.1.0" }
tear-ws-bridge = { path = "tear-ws-bridge", version = "0.1.0" }
tear = { path = "tear", version = "0.1.0" }
praca = { path = "praca", version = "0.1.0" }

# ── pleme-io shared libraries — same versions mado pins ────────────
# Live configuration with hot-reload. Operators learn the shikumi
# config style ONCE — mado + tear both consume `~/.config/<app>/<app>.yaml`
# via shikumi so cross-tool muscle memory carries over.
# `cli` feature pulls in shikumi::cli::ConfigShowCommand — the reusable
# clap subcommand factory tear's binary wires into via one Subcommand
# variant. Pin to branch=main so the workspace stays on a single
# canonical shikumi source.
shikumi = { git = "https://github.com/pleme-io/shikumi", branch = "main", features = ["cli"] , version = "0.1" }
# Typed design tokens — palette + typography. tear's StatusBar /
# tab-bar / pane-border / message colors all resolve through ishou
# so a fleet-wide colorway change is one ishou-tokens edit.
ishou-tokens = { git = "https://github.com/pleme-io/ishou" , version = "0.1" }
# Typed terminal-conformance contract (dev-only). tear-core's
# conformance tests drive PaneGrid + the subscriber fan-out against
# espelho's VT query catalog — tear is the pass-through RELAY row
# (queries survive verbatim to subscribers); mado holds the host row,
# frost the guest row.
espelho = { git = "https://github.com/pleme-io/espelho", branch = "main", version = "0.1" }

# ── canonical fleet runtime crates ─────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
arc-swap = "1"
mimalloc = { version = "0.1", default-features = false }
blake3 = "1"
once_cell = "1"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# ── PTY backend (cross-platform; same crate mado uses transitively) ─
portable-pty = "0.9"

# ── VT100/xterm parser (same major mado uses; one parser fleet-wide) ─
vte = "0.15"

# ── RPC wire format (tear-daemon ↔ tear-client) ─────────────────────
# ciborium (CBOR / RFC 8949) — self-describing binary serde format
# that handles internally-tagged enums (LayoutNode uses
# `#[serde(tag = "kind")]` so bincode is off the table). Fast enough
# for IPC (the wire is single Request/Response per call, not a
# streaming hot path) and the on-wire bytes stay debug-inspectable
# via `cbor-diag` / `pycbor`.
ciborium = "0.2"

# ── unit conversions for layout / dimensions ────────────────────────
nix = { version = "0.30", features = ["term"] }

# ── WebSocket transport for the browser-facing tear-ws-bridge (#1) ─
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile]

[profile.release]
codegen-units = 1
# opt-level = 3 (speed). Same shape mado uses — tear is a daemon and
# CLI that compose with mado for fleet pane semantics; size opt would
# regress the hot-path operations (PTY pump, status-bar refresh).
opt-level = 3
lto = "fat"
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
