[package]
name = "tear-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed RPC client for tear-daemon. Consumed by the tear bin, mado (Tier 2 native-split mode), and third parties that want to drive tear sessions."

[lints]
workspace = true

[features]
default = []
# Opt-in engate Producer impl over the daemon-mode subscribe path.
engate = ["dep:engate-types", "dep:engate-attach", "tear-types/engate"]

[dependencies]
tear-types = { workspace = true }
tear-config = { workspace = true }
parking_lot = { workspace = true }
serde_yaml_ng = { workspace = true }
engate-types = { version = "0.1", optional = true }
engate-attach = { version = "0.1", optional = true }

[dev-dependencies]
tear-core = { path = "../tear-core" }
# `testing` ships DaemonHarness — a real tear-daemon on a private
# UDS. The capability tests need BOTH ends real: a current daemon for
# the positive control, and a hand-built pre-capability serve loop for
# the degradation case.
tear-daemon = { path = "../tear-daemon", features = ["testing"] }
# Derives the reconstructed pre-capability `Request` enum the
# degradation test decodes against.
serde = { workspace = true }
