[package]
name = "tear-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed RPC client for tear-daemon. Consumed by the tear bin, mado (Tier 2 native-split mode), and third parties that want to drive tear sessions."

[lints]
workspace = true

[features]
default = []
# Opt-in engate Producer impl over the daemon-mode subscribe path.
engate = ["dep:engate-types", "dep:engate-attach"]

[dependencies]
tear-types = { workspace = true }
tear-config = { workspace = true }
parking_lot = { workspace = true }
serde_yaml_ng = { workspace = true }
engate-types = { git = "https://github.com/pleme-io/engate", branch = "main", optional = true }
engate-attach = { git = "https://github.com/pleme-io/engate", branch = "main", optional = true }

[dev-dependencies]
tear-core = { workspace = true }
tear-daemon = { workspace = true }
