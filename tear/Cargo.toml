[package]
name = "tear"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tear (Portuguese: loom) — Rust-native tmux-compatible terminal multiplexer with typed shikumi config. Weaves panes into sessions."

[lints]
workspace = true

[[bin]]
name = "tear"
path = "src/main.rs"

[dependencies]
tear-types = { workspace = true }
tear-config = { workspace = true }
# Typed cross-tool environment contract — FleetStateVar owns the
# canonical TEAR_TIER / TEAR_CLIENT_ID env-var names this binary reads,
# the same typed surface seki's prompt + tear-core's pane-spawn use.
ishou-tokens = { workspace = true }
# Shikumi — the `cli` feature ships ConfigShowCommand, the canonical
# clap factory every TieredConfig consumer wires in (Pillar 12: one
# Subcommand variant replaces every hand-rolled config-show surface).
shikumi = { workspace = true }
tear-core = { workspace = true }
tear-client = { workspace = true }
tear-daemon = { workspace = true }
tear-tmux-backend = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
ctrlc = "3"
# `tear top` interactive dashboard (48a)
ratatui = "0.30"
crossterm = "0.28"
# `tear ai` LLM proxy — sync HTTP client (no tokio runtime needed
# because the CLI is short-lived; matches tear's existing sync
# style). Pure rustls TLS — no native OpenSSL link dep.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# `tear mcp` — stdio MCP server for perf + introspection. Opt-in
# subcommand wired into Claude Code's MCP server list so agents
# can interrogate the daemon (sessions / panes / bytes / CPU /
# RSS) over JSON-RPC without scraping `tear list` output.
rmcp = { version = "1.4", features = ["server", "transport-io"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
sysinfo = "0.32"
shidou = { git = "https://github.com/pleme-io/shidou" , version = "0.1" }

[dev-dependencies]
tempfile = "3"
# Enables tear_daemon::testing::{DaemonHarness, DuplexStream}
# during test compilation only; production builds keep the feature
# off so the helpers are gated out. The `testing` feature must be
# NAMED here — the module is `#[cfg(any(test, feature = "testing"))]`
# and `test` is never set when tear-daemon is built as a dependency
# of an integration test, so omitting the feature is E0432.
tear-daemon = { path = "../tear-daemon", features = ["testing"] }
