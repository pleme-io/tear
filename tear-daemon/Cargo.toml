[package]
name = "tear-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Long-running tear server. Owns sessions across client disconnects, snapshots state, exposes typed UDS RPC. Wraps tear-core::InProcess."

[lints]
workspace = true

[dependencies]
tear-types = { workspace = true }
tear-core = { workspace = true }
tear-config = { workspace = true }
# praça (M1 "Remember"): the typed session-orchestration substrate.
# The daemon persists its project↔session bindings + frecency index
# (a `praca::PracaSnapshot`) so they survive daemon restarts.
praca = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
# Kanshou — live process introspection over Unix sockets. The daemon
# opens a kanshou socket exposing the live Registry (sessions, panes,
# subscriber counts) so operator tools and MCP servers query the
# actual state. See pleme-io/kanshou.
kanshou = { git = "https://github.com/pleme-io/kanshou" , version = "0.1" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
# notify is used transitively via tear-config; we re-export the
# watcher type from DaemonHandle for keep-alive semantics.
notify = { workspace = true }

[features]
# Expose the in-memory test harness (DuplexStream + helpers) to
# downstream test crates. Enabled by tear-daemon's own tests via
# the standard cfg(test) gate; downstream crates opt in by adding
# `tear-daemon = { workspace = true, features = ["testing"] }` to
# their [dev-dependencies].
default = []
testing = []
